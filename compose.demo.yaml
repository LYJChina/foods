services:
  document-parser:
    build:
      context: .
      dockerfile: docker/demo/parser.Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      MINERU_API_OUTPUT_ROOT: /runtime/parser-output
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_PROCESSING_WINDOW_SIZE: "1"
      MINERU_PDF_RENDER_THREADS: "1"
    volumes:
      - parser_output:/runtime/parser-output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/demo/backend.Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env.local
        required: false
    environment:
      DOCUMENT_PARSER_URL: http://document-parser:8002
      ENVIRONMENT: dev
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8001"
      SQLITE_DB_NAME: /app/data/demo.db
    depends_on:
      document-parser:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/demo/web.Dockerfile
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      VITE_APP_ENV: dev
      VITE_BASE_URL: /web/
      VITE_PORT: "5180"
      VITE_APP_BASE_API: /api/v1
      VITE_API_BASE_URL: http://backend:8001
      VITE_API_URL: /
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5180/web/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  parser_output:
  backend_data:
